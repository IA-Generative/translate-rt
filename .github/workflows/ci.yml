name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

# On annule les runs obsolètes en CI (rien n'est publié). Ne jamais le faire en CD.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      IMAGE_BASE: ${{ steps.vars.outputs.IMAGE_BASE }}
      IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
    steps:
    - id: vars
      shell: bash
      # ghcr.io refuse les majuscules : ${GITHUB_REPOSITORY,,} passe en minuscules.
      run: |
        echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "IMAGE_TAG=pr-${{ github.event.pull_request.number || 'manual' }}" >> "$GITHUB_OUTPUT"

  lint-commits:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-commits.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read

  scan-gitleaks:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-gitleaks.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      GITHUB_SECURITY_TAB: true

  scan-trivy-conf:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      PATH: ./
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      CATEGORY: trivy-config

  build-docker:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs: [expose-vars]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/translate-rt
      IMAGE_TAG: ${{ needs.expose-vars.outputs.IMAGE_TAG }}
      IMAGE_CONTEXT: .
      IMAGE_DOCKERFILE: Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: false
      CACHE: true

  scan-trivy-image:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs: [expose-vars, build-docker]
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      IMAGE: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/translate-rt:${{ needs.expose-vars.outputs.IMAGE_TAG }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      CATEGORY: trivy-image
      TIMEOUT: 10m

  all-jobs-passed:
    name: Check jobs status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
    - expose-vars
    - lint-commits
    - scan-gitleaks
    - scan-trivy-conf
    - build-docker
    - scan-trivy-image
    steps:
    - name: Check status of all required jobs
      run: |-
        NEEDS_CONTEXT='${{ toJson(needs) }}'
        for JOB_ID in $(echo "$NEEDS_CONTEXT" | jq -r 'keys[]'); do
          RESULT=$(echo "$NEEDS_CONTEXT" | jq -r ".[\"$JOB_ID\"].result")
          echo "$JOB_ID job result: $RESULT"
          if [[ $RESULT != "success" && $RESULT != "skipped" ]]; then
            echo "Error: the $JOB_ID job did not pass."
            exit 1
          fi
        done
